<!doctype html>
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1280px;height:640px;font-family:'Inter',sans-serif;overflow:hidden;
 background:radial-gradient(circle at 15% 20%,#4338CA 0,transparent 55%),radial-gradient(circle at 90% 90%,#DB2777 0,transparent 50%),linear-gradient(135deg,#1E1B4B,#3B0764 60%,#4A044E);color:#fff;position:relative}
.stars{position:absolute;inset:0;background-image:radial-gradient(#ffffff55 1px,transparent 1px);background-size:38px 38px;opacity:.35}

.phone img{width:100%;display:block}
.p1{left:735px;top:70px;transform:rotate(-6deg)}
