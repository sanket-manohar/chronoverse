<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338CA"/>
      <stop offset="0.55" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#DB2777"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <circle cx="400" cy="110" r="70" fill="#FFFFFF" opacity="0.07"/>
  <circle cx="96" cy="430" r="110" fill="#FFFFFF" opacity="0.05"/>
  <!-- orbit, back half -->
  <ellipse cx="256" cy="300" rx="214" ry="62" fill="none" stroke="url(#orbit)" stroke-width="10" transform="rotate(-18 256 300)" opacity="0.55"/>
  <!-- calendar card -->
  <g filter="url(#shadow)">
    <rect x="128" y="132" width="256" height="248" rx="44" fill="#FFFFFF"/>
    <path d="M128 176 a44 44 0 0 1 44 -44 h168 a44 44 0 0 1 44 44 v26 h-256z" fill="#EEF0FF"/>
    <rect x="186" y="104" width="22" height="58" rx="11" fill="#FFFFFF"/>
    <rect x="304" y="104" width="22" height="58" rx="11" fill="#FFFFFF"/>
    <g fill="#C7CBF5">
      <circle cx="190" cy="240" r="15"/><circle cx="256" cy="240" r="15"/><circle cx="322" cy="240" r="15"/>
      <circle cx="190" cy="298" r="15"/><circle cx="322" cy="298" r="15"/>
    </g>
    <circle cx="256" cy="298" r="24" fill="#7C3AED"/>
  </g>
  <!-- orbit, front arc and planet -->
  <path d="M 52.5 366.1 A 214 62 -18 0 0 459.5 233.9" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.95"/>
  <circle cx="459.5" cy="233.9" r="22" fill="#FDE68A" stroke="#FFFFFF" stroke-width="7"/>
</svg>
