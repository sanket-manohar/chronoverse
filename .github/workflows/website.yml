name: Website

# Publishes website/ (with the logo, screenshots and guides) to the
# repository's pages site.
on:
  push:
    branches: [main]
    paths: ['website/**', 'doc/**', '.github/workflows/website.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site/assets
          cp -r website/* _site/
          cp -r doc/brand doc/screenshots doc/guides _site/assets/
          rm -rf _site/assets/guides/src _site/assets/brand/*.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
